name: Build macOS App
on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
permissions:
  contents: read
jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build DMG and ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_PUBLISH: "never"
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: WHT-ALPHA-v1.1-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
